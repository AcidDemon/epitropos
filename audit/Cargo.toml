[package]
name = "epitropos-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authoritative privilege-event feed: correlates Linux audit records to session recordings and emits a signed, hash-chained sidecar"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
rand = "0.8"
inotify = "0.11"

[dev-dependencies]
tempfile = "3"
